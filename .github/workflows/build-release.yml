name: Build and release violoop-edge-kiosk-qt

# Same shape as ../../edge-front2/.github/workflows/build-release.yml:
# tag push builds + releases, workflow_dispatch builds without releasing.
# Runs on a native arm64 GitHub-hosted runner (not cross-compiled) because
# violoop-qt6, the Qt runtime this links against, only ships an arm64
# build - see app/packaging/debian/control.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          # See ci.yml's equivalent step: without this, the git-lfs-tracked
          # assets under app/assets/ check out as pointer stubs, not real
          # content, and the release .deb would ship a broken glTF asset.

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config curl ca-certificates \
            libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev
          # The EGL/GLES/XKB -dev packages above aren't violoop-qt6's own
          # Depends (those only list runtime libs - libegl1, libgles2 -
          # not headers) - they're what Qt6Gui's own CMake config
          # transitively find_package()s for when something configures
          # against it. dev1 already has them from earlier, unrelated
          # work, which is why this gap didn't show up until CI ran on a
          # clean runner.

      - name: Install violoop-qt6
        # Fetched directly from the BvioTech/violoop-qt-build GitHub
        # Release, NOT from deb.violoop.ai (tried that first - confirmed
        # by curling its Packages index directly that violoop-qt6 isn't
        # actually in either the stable or testing channel there, even
        # though a real, non-draft v6.8.5-violoop3 release with the
        # expected asset has existed on GitHub for over a day: that repo's
        # own release workflow has no webhook-notify step, so it depends
        # entirely on the apt service's hourly fallback sync, which for
        # whatever reason hasn't picked this package up - not something
        # fixable from here). `apt-get install -y ./file.deb` resolves
        # Depends from the runner's normal Ubuntu repos same as if it came
        # from an apt source.
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/BvioTech/violoop-qt-build/releases/latest \
            | python3 -c 'import json,sys,re; a=json.load(sys.stdin)["assets"]; m=[x["browser_download_url"] for x in a if re.match(r"^violoop-qt6_.*_arm64\.deb$", x["name"])]; print(m[0] if m else "")')
          if [ -z "$URL" ]; then
            echo "::error::no violoop-qt6_*_arm64.deb asset found on the latest BvioTech/violoop-qt-build release"
            exit 1
          fi
          echo "Downloading $URL"
          curl -fsSL -o /tmp/violoop-qt6.deb "$URL"
          sudo apt-get install -y /tmp/violoop-qt6.deb

      - name: Offscreen smoke test
        # Cheap, high-value check learned the hard way during real-device
        # bring-up this repo's app went through (see app/docs/progress.md -
        # a QML error that builds/loads fine but crashes at runtime, like
        # the Window-has-no-font-property incident, would otherwise only
        # surface on the real kiosk). Doesn't need GPU/display access.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/violoop-qt6
          cmake --build build
          LD_LIBRARY_PATH=/opt/violoop-qt6/lib \
          QML2_IMPORT_PATH=/opt/violoop-qt6/qml \
          QT_QPA_PLATFORM=offscreen \
            timeout 5 ./build/violoop_edge_kiosk_qt || [ $? -eq 124 ]
          # timeout's own exit code 124 means "still running after 5s with
          # no crash" - the success case for an application that runs
          # until killed. Anything else (QML load failure, segfault, ...)
          # is a real failure and should fail the build.

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^Version: .*/Version: ${VERSION}/" packaging/debian/control
          echo "Packaging version: ${VERSION}"

      - name: Build .deb
        run: bash scripts/build-deb.sh arm64

      - name: Checksums
        run: |
          cd output
          for f in *.deb; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: release-files-arm64
          path: |
            app/output/*.deb
            app/output/*.sha256
          retention-days: 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-files-*
          merge-multiple: true
          path: .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            *.deb
            *.sha256
