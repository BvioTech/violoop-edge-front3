name: CI

# PR validation only - build-release.yml (tag push / workflow_dispatch)
# handles the actual .deb build and release. This just needs to catch
# compile errors and QML load errors before merge; no separate test
# framework exists for this C++/QML project yet.
on:
  pull_request:
    branches: [main]
    # The app is the repository itself; demos/ holds the earlier spikes,
    # which this workflow does not build.
    paths-ignore:
      - "demos/**"

jobs:
  build-and-smoke-test:
    # Native arm64 runner, not cross-compiled - violoop-qt6 (the Qt
    # runtime this links against, see README.md) only ships an arm64
    # build, same reasoning as build-release.yml.
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          # Without this, assets/away/VIO_DesktopPet.glb (tracked via
          # git-lfs, see ../../.gitattributes) checks out as a tiny LFS
          # pointer stub instead of real glTF bytes - CMake's RESOURCES
          # step would embed the stub as-is (no error), and the offscreen
          # smoke test below would only fail with RuntimeLoader's generic
          # "No suitable reader found" error, same confusing failure mode
          # qt3d-spike's fetch-assets.sh already hit once for a truncated
          # download (see that script's comment) - same root cause class,
          # caught here instead by actually fetching LFS content.

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config curl ca-certificates \
            libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev
          # See build-release.yml's equivalent step for why these -dev
          # packages are needed beyond violoop-qt6's own Depends.

      - name: Install violoop-qt6
        # Fetched directly from the BvioTech/violoop-qt-build GitHub
        # Release, NOT from deb.violoop.ai (tried that first - confirmed
        # by curling its Packages index directly that violoop-qt6 isn't
        # actually in either the stable or testing channel there, even
        # though a real, non-draft v6.8.5-violoop3 release with the
        # expected asset has existed on GitHub for over a day: that repo's
        # own release workflow has no webhook-notify step, so it depends
        # entirely on the apt service's hourly fallback sync, which for
        # whatever reason hasn't picked this package up - not something
        # fixable from here). `apt-get install -y ./file.deb` resolves
        # Depends from the runner's normal Ubuntu repos same as if it came
        # from an apt source.
        run: |
          URL=$(curl -fsSL https://api.github.com/repos/BvioTech/violoop-qt-build/releases/latest \
            | python3 -c 'import json,sys,re; a=json.load(sys.stdin)["assets"]; m=[x["browser_download_url"] for x in a if re.match(r"^violoop-qt6_.*_arm64\.deb$", x["name"])]; print(m[0] if m else "")')
          if [ -z "$URL" ]; then
            echo "::error::no violoop-qt6_*_arm64.deb asset found on the latest BvioTech/violoop-qt-build release"
            exit 1
          fi
          echo "Downloading $URL"
          curl -fsSL -o /tmp/violoop-qt6.deb "$URL"
          sudo apt-get install -y /tmp/violoop-qt6.deb

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/violoop-qt6
          cmake --build build

      - name: Offscreen smoke test
        # Loads AppShell.qml and every page it can reach without a
        # display/GPU - catches the class of bug this repo hit for real
        # (docs/progress.md): a QML error that builds and loads fine
        # but only crashes on the actual kiosk. Doesn't exercise touch
        # navigation or real backend data, just "does it come up clean".
        run: |
          LD_LIBRARY_PATH=/opt/violoop-qt6/lib \
          QML2_IMPORT_PATH=/opt/violoop-qt6/qml \
          QT_QPA_PLATFORM=offscreen \
            timeout 5 ./build/violoop_edge_kiosk_qt || status=$?
          # timeout's exit code 124 means "still running after 5s with no
          # crash" - the success case for an app that runs until killed.
          # (Captured with `|| status=$?` above: the step runs under
          # `bash -e`, which would otherwise abort on the 124 itself before
          # this check ever ran.)
          status=${status:-0}
          if [ "$status" -ne 124 ]; then
            echo "app exited with status $status instead of running - treating as a failure"
            exit 1
          fi
